name: Test, build and deploy EMS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ems-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EMS_TEST_INFLUXDB: "0"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            deploy/requirements.txt
            requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r deploy/requirements.txt httpx==0.28.1 matplotlib==3.11.2
          python -m pip check

      # Model and full UI tests require private trained weights in outputs/.
      - name: Test forecast evaluation
        run: python -m unittest discover -s tests -p test_evaluation.py -v

      - name: Test economic replay invariants
        run: python -m unittest discover -s tests -p test_economic_evaluation.py -v

      - name: Test storage and API failures
        run: python -m unittest discover -s tests -p test_repository.py -v

      - name: Test telemetry publication and recovery
        run: python -m unittest discover -s tests -p test_telemetry.py -v

  build:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      AZURE_HOST: ${{ secrets.AZURE_HOST }}
      AZURE_USER: ${{ secrets.AZURE_USER }}
      DEPLOY_IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@v6

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AZURE_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.AZURE_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ems_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/ems_deploy ~/.ssh/known_hosts

      - name: Upload image configuration
        run: |
          scp -i ~/.ssh/ems_deploy -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            deploy/compose.image.yaml \
            "${AZURE_USER}@${AZURE_HOST}:EMS/compose.image.yaml"

      - name: Update API and frontend
        run: |
          ssh -i ~/.ssh/ems_deploy -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 -o ServerAliveCountMax=4 \
            "${AZURE_USER}@${AZURE_HOST}" "bash -s -- '$DEPLOY_IMAGE'" <<'REMOTE'
          set -euo pipefail
          cd ~/EMS
          compose=(sudo -n env "EMS_IMAGE=$1" docker compose
            -f compose.yaml -f compose.override.yaml -f compose.image.yaml)
          "${compose[@]}" config --quiet
          "${compose[@]}" pull api frontend
          "${compose[@]}" up -d --no-build --no-deps --wait --wait-timeout 600 api
          "${compose[@]}" up -d --no-build --no-deps --wait --wait-timeout 600 frontend
          "${compose[@]}" ps api frontend
          REMOTE

      - name: Remove SSH private key
        if: always()
        run: rm -f ~/.ssh/ems_deploy
